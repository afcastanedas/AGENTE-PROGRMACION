<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetos 1</title>
  <!-- estilos de la carta, la galería y el modo oscuro -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Objetos 1</h1>
    <!-- Objetos 1.js le agrega el listener de click que hace el toggle -->
    <button id="dark-mode-toggle">Modo oscuro</button>
  </header>

  <!-- contenedor vacío: Objetos 1.js lo llena con las 12 cartas generadas dinámicamente -->
  <section id="galeria"></section>

  <!-- modal oculto por defecto (clase "hidden" en style.css): se llena y se muestra al hacer click en una carta -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-content"></div>
  </div>

  <script src="Objetos 1.js"></script>
</body>
</html>
