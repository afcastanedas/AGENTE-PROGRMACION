<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclistas de Ruta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ciclistas de Ruta</h1>
    <nav>
      <a href="index.html">Galería</a>
      <a href="gestion.html">Gestión</a>
    </nav>
    <button id="dark-mode-toggle">Modo oscuro</button>
  </header>

  <!-- index.js escucha estos botones y vuelve a llamar renderizarGaleria con el array filtrado -->
  <section id="filtros">
    <button type="button" class="filter-btn active" data-filter="all">Todos</button>
    <button type="button" class="filter-btn" data-filter="veteran">Veterano</button>
    <button type="button" class="filter-btn" data-filter="rookie">Joven promesa</button>

    <!-- index.js la llena con los equipos que existan en data.js -->
    <select id="team-filter">
      <option value="all">Todos los equipos</option>
    </select>

    <button type="button" id="reset-filters" class="filter-btn">Restaurar filtros</button>
  </section>

  <div class="gallery-layout">
    <!-- index.js escucha "input" (se dispara en cada movimiento) y filtra por edad máxima -->
    <aside id="filtro-edad">
      <label for="age-slider">Edad máxima</label>
      <input type="range" id="age-slider" min="22" max="34" value="34" step="1" orient="vertical">
      <span id="age-value">34</span>
    </aside>

    <!-- index.js llena este contenedor con una carta por cada objeto de data.js -->
    <section id="galeria"></section>
  </div>

  <!-- data.js va primero: declara el array que index.js necesita -->
  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="index.js"></script>
</body>
</html>
